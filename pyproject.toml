[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "coop-assistant"
version = "0.1.0"
description = "Offline, multilingual Small AI voice assistant for farmer cooperatives and small businesses"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "faster-whisper>=1.2",
    "gradio>=5.0",
    "piper-tts>=1.3",
    "fastapi>=0.110",
    "uvicorn>=0.30",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
finetune = [
    "torch>=2.3",
    "transformers>=4.45",
    "peft>=0.12",
    "trl>=0.20",
    "datasets>=2.20",
    "accelerate>=0.33",
]

[project.scripts]
coop-web = "coop_assistant.apps.web_ui:main"
coop-call = "coop_assistant.apps.call_server:main"

[tool.setuptools.packages.find]
where = ["src"]
